; Firmware del nodo sensor IoT (ESP32 DevKit v1) - Laguna de Paca.
;
; Estructura:
;   lib/lagunapaca_core/  logica portable y testeable (sin Arduino)
;   src/main.cpp          glue de Arduino (WiFi, ADC, 1-Wire, HTTP/MQTT, Deep Sleep)
;   src/hardware/         drivers de sensores y transporte HTTP
;   src/net/              WiFi y transporte MQTT
;   test/test_core/       tests de la logica portable
;
; Comandos:
;   pio test -e native        corre los tests en la PC (requiere g++ en el PATH)
;   pio run -e esp32dev       compila el firmware con transporte HTTP (default)
;   pio run -e esp32dev-mqtt  compila la variante que publica por MQTT

[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------------------
; Placa: ESP32 DevKit v1 con framework Arduino
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_framework = unity
build_flags =
    -DUNITY_INCLUDE_DOUBLE
    -Wall
    -Wextra
; Cada entorno compila solo su transporte: la otra via queda fuera del build.
build_src_filter =
    +<*>
    -<net/MqttTelemetryTransport.cpp>
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.2.0
    256dpi/MQTT@^2.5.2

; ---------------------------------------------------------------------------
; Variante del firmware que publica por MQTT en lugar de HTTP POST.
; HTTP es el canal por defecto (ver include/config.h); este entorno existe para
; compilar y verificar la otra via sin tocar la configuracion base.
; ---------------------------------------------------------------------------
[env:esp32dev-mqtt]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DLAGUNA_TELEMETRY_MQTT
build_src_filter =
    +<*>
    -<hardware/HttpTelemetryTransport.cpp>

; ---------------------------------------------------------------------------
; Tests de la logica portable en la maquina de desarrollo (sin hardware).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DUNITY_INCLUDE_DOUBLE
    -Wall
    -Wextra
