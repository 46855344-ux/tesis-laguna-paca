<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body class="pagina-login">

    <button type="button"
            class="boton boton--icono tema-flotante"
            data-accion="alternar-tema"
            aria-pressed="false"
            aria-label="Cambiar a modo oscuro"
            title="Cambiar a modo oscuro">
        <span class="js-icono-sol">
            <span th:replace="~{fragments/icons :: sol}"></span>
        </span>
        <span class="js-icono-luna">
            <span th:replace="~{fragments/icons :: luna}"></span>
        </span>
    </button>

    <main class="tarjeta-login">

        <div class="tarjeta-login__marca">
            <span class="marca__icono">
                <span th:replace="~{fragments/icons :: gota}"></span>
            </span>
            <h1>Laguna Paca</h1>
            <p>Panel de monitoreo de la calidad del agua</p>
        </div>

        <!-- Spring Security añade ?error o ?logout a la URL: la vista solo
             traduce ese estado a un mensaje comprensible. -->
        <p th:if="${param.error}" class="aviso aviso--error" role="alert">
            <span th:replace="~{fragments/icons :: candado}"></span>
            <span>Usuario o contraseña incorrectos. Inténtalo de nuevo.</span>
        </p>

        <p th:if="${param.logout}" class="aviso aviso--info" role="status">
            <span th:replace="~{fragments/icons :: escudo}"></span>
            <span>Cerraste sesión correctamente.</span>
        </p>

        <!-- th:action añade el token CSRF automáticamente: sin él, Spring
             Security rechaza el POST con 403. -->
        <form th:action="@{/login}" method="post" data-validar novalidate>

            <div class="campo">
                <label class="campo__etiqueta" for="usuario">Usuario</label>
                <input class="campo__control"
                       id="usuario"
                       name="username"
                       type="text"
                       required
                       autofocus
                       autocomplete="username"
                       placeholder="admin"
                       aria-describedby="error-usuario">
                <p class="campo__error" id="error-usuario">Escribe tu usuario.</p>
            </div>

            <div class="campo">
                <label class="campo__etiqueta" for="contrasena">Contraseña</label>
                <input class="campo__control"
                       id="contrasena"
                       name="password"
                       type="password"
                       required
                       autocomplete="current-password"
                       placeholder="Tu contraseña"
                       aria-describedby="error-contrasena">
                <p class="campo__error" id="error-contrasena">Escribe tu contraseña.</p>
            </div>

            <button type="submit" class="boton boton--primario boton--bloque">
                <span th:replace="~{fragments/icons :: candado}"></span>
                <span>Iniciar sesión</span>
            </button>
        </form>

        <p class="tarjeta-login__pie">
            Acceso restringido al personal autorizado del monitoreo.
        </p>
    </main>

    <div th:replace="~{fragments/toast :: contenedor}"></div>
</body>
</html>
