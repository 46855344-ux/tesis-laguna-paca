<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Barra superior.

  Uso:  <header th:replace="~{fragments/navbar :: navbar('Panel de monitoreo')}"></header>

  Contiene el botón del menú móvil, el título de la página, el conmutador de
  tema y el menú de usuario con la opción de cerrar sesión.
-->
<header th:fragment="navbar(titulo)" class="barra-superior">

    <button type="button"
            id="abrir-menu"
            class="boton boton--icono solo-movil"
            aria-controls="barra-lateral"
            aria-expanded="false"
            aria-label="Abrir el menú de navegación">
        <span th:replace="~{fragments/icons :: menu}"></span>
    </button>

    <div class="barra-superior__titulo">
        <h1 th:text="${titulo}">Panel de monitoreo</h1>
        <p>Laguna de Paca · Junín</p>
    </div>

    <div class="barra-superior__acciones">

        <button type="button"
                class="boton boton--icono"
                data-accion="alternar-tema"
                aria-pressed="false"
                aria-label="Cambiar a modo oscuro"
                title="Cambiar a modo oscuro">
            <span class="js-icono-sol">
                <span th:replace="~{fragments/icons :: sol}"></span>
            </span>
            <span class="js-icono-luna">
                <span th:replace="~{fragments/icons :: luna}"></span>
            </span>
        </button>

        <div class="menu-usuario">
            <button type="button"
                    id="abrir-menu-usuario"
                    class="menu-usuario__disparador"
                    aria-haspopup="true"
                    aria-expanded="false"
                    aria-controls="menu-usuario">
                <span class="avatar" aria-hidden="true" th:text="${sesion.inicial}">A</span>
                <span class="menu-usuario__datos">
                    <strong th:text="${sesion.usuario}">admin</strong>
                    <small th:text="${sesion.rol}">Administrador</small>
                </span>
                <span th:replace="~{fragments/icons :: chevron}"></span>
                <span class="visualmente-oculto">Abrir el menú de usuario</span>
            </button>

            <div class="menu-usuario__lista" id="menu-usuario" hidden>
                <p class="menu-usuario__encabezado">
                    Sesión iniciada como <strong th:text="${sesion.usuario}">admin</strong>
                </p>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="menu-usuario__opcion">
                        <span th:replace="~{fragments/icons :: salir}"></span>
                        <span>Cerrar sesión</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>
</html>
