<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Barra lateral de navegación.

  Uso:  <aside th:replace="~{fragments/sidebar :: sidebar('panel')}"></aside>
  El parámetro `activo` marca la sección actual con color y aria-current="page".

  En escritorio se contrae a solo iconos; en móvil es un cajón que se abre con
  el botón de la barra superior. Los enlaces conservan aria-label siempre,
  porque al contraerse el texto deja de ser visible para los lectores de
  pantalla y el nombre accesible vendría de la nada.
-->
<aside th:fragment="sidebar(activo)" id="barra-lateral" class="barra-lateral" aria-label="Menú principal">

    <a class="marca" th:href="@{/panel}" aria-label="Laguna Paca, ir al panel de monitoreo">
        <span class="marca__icono">
            <span th:replace="~{fragments/icons :: gota}"></span>
        </span>
        <span class="marca__texto">
            <strong>Laguna Paca</strong>
            <small>Monitoreo ambiental</small>
        </span>
    </a>

    <nav class="navegacion" aria-label="Secciones del panel">
        <p class="navegacion__titulo" id="grupo-monitoreo">Monitoreo</p>
        <ul aria-labelledby="grupo-monitoreo">
            <li>
                <a th:href="@{/panel}"
                   class="nav-item"
                   th:classappend="${activo == 'panel'} ? ' nav-item--activo' : ''"
                   th:attr="aria-current=${activo == 'panel' ? 'page' : null}"
                   aria-label="Panel de monitoreo">
                    <span th:replace="~{fragments/icons :: panel}"></span>
                    <span class="nav-item__texto">Panel</span>
                </a>
            </li>
            <li>
                <span class="nav-item nav-item--pronto" aria-label="Historial de muestras, disponible próximamente">
                    <span th:replace="~{fragments/icons :: historial}"></span>
                    <span class="nav-item__texto">Historial</span>
                    <span class="etiqueta etiqueta--neutra">Pronto</span>
                </span>
            </li>
            <li>
                <span class="nav-item nav-item--pronto" aria-label="Alertas ECA-Agua, disponible próximamente">
                    <span th:replace="~{fragments/icons :: alertas}"></span>
                    <span class="nav-item__texto">Alertas</span>
                    <span class="etiqueta etiqueta--neutra">Pronto</span>
                </span>
            </li>
        </ul>

        <p class="navegacion__titulo" id="grupo-sistema">Sistema</p>
        <ul aria-labelledby="grupo-sistema">
            <li>
                <span class="nav-item nav-item--pronto" aria-label="Estaciones de muestreo, disponible próximamente">
                    <span th:replace="~{fragments/icons :: estaciones}"></span>
                    <span class="nav-item__texto">Estaciones</span>
                    <span class="etiqueta etiqueta--neutra">Pronto</span>
                </span>
            </li>
            <li>
                <span class="nav-item nav-item--pronto" aria-label="Configuración del sistema, disponible próximamente">
                    <span th:replace="~{fragments/icons :: configuracion}"></span>
                    <span class="nav-item__texto">Configuración</span>
                    <span class="etiqueta etiqueta--neutra">Pronto</span>
                </span>
            </li>
        </ul>
    </nav>

    <div class="barra-lateral__pie solo-escritorio">
        <button type="button"
                id="alternar-barra"
                class="boton boton--fantasma boton--ancho"
                aria-controls="barra-lateral"
                aria-expanded="true"
                aria-label="Contraer el menú lateral"
                title="Contraer el menú lateral">
            <span th:replace="~{fragments/icons :: panelIzquierdo}"></span>
            <span class="nav-item__texto js-texto-barra">Contraer menú</span>
        </button>
    </div>
</aside>
</html>
