<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Iconos del panel — trazos de Lucide (MIT), incrustados como SVG en lugar de
  cargar una librería completa.

  Por qué incrustados:
    - No hay petición extra ni parpadeo: el icono aparece con la página.
    - Heredan el color con currentColor, así siguen al tema claro/oscuro.
    - Se copian solo los 16 iconos que se usan, no los cientos del paquete.

  Uso:  <span th:replace="~{fragments/icons :: panel}"></span>
  Todos llevan aria-hidden="true" porque acompañan a un texto visible: si el
  icono fuera lo único que comunica algo, llevaría un <title> propio.
-->

</svg>
