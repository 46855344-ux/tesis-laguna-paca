name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y probar
        working-directory: backend
        run: mvn -B test

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: error

  backend-postgres:
    name: Migraciones (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: laguna_paca
          POSTGRES_USER: laguna
          POSTGRES_PASSWORD: laguna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laguna -d laguna_paca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Ejecuta un IT que no corre en `mvn test`: valida el índice parcial,
      # TIMESTAMPTZ y las restricciones CHECK contra PostgreSQL 16 real.
      - name: Aplicar Flyway y validar el esquema
        working-directory: backend
        env:
          POSTGRES_URL: "jdbc:postgresql://localhost:5432/laguna_paca"
          POSTGRES_USER: laguna
          POSTGRES_PASSWORD: laguna
        run: mvn -B -Dtest=PostgresMigrationIT test

  ia-model:
    name: Modelo y API de IA (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ia-model/requirements.txt

      - name: Instalar PyTorch CPU
        run: pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependencias
        run: pip install -r ia-model/requirements.txt

      - name: Probar el modelo y la API
        working-directory: ia-model
        run: python -m pytest -q

  firmware:
    name: Firmware (PlatformIO nativo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Probar el núcleo portable
        working-directory: iot-firmware
        run: pio test -e native

  sonar:
    name: SonarQube (opcional)
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Sin los secretos configurados el paso se omite: no se inventa un
      # resultado de SonarQube ni se hace fallar el CI por no tener servidor.
      - name: Analizar
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        run: >
          mvn -B -f backend/pom.xml verify jacoco:report sonar:sonar
          -Dsonar.projectBaseDir=.
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
