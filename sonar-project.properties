# SonarQube / SonarCloud (análisis estático).
#
# No hay servidor SonarQube en la máquina de desarrollo, así que este archivo
# solo deja el análisis configurado. Se ejecuta donde exista un servidor:
#
#   mvn -f backend/pom.xml -B verify jacoco:report
#   sonar-scanner -Dsonar.token=$SONAR_TOKEN
#
# La cobertura de Java se lee del informe de JaCoCo que genera `mvn test`.

sonar.projectKey=laguna-paca
sonar.projectName=Laguna Paca - Monitorización IoT + ST-GNN
sonar.projectVersion=0.1.0-SNAPSHOT

sonar.sources=backend/src/main/java,ia-model/lagunapaca_gnn,ia-model/serve.py
sonar.tests=backend/src/test/java,ia-model/tests
sonar.sourceEncoding=UTF-8

# El firmware es C++ con PlatformIO: se analiza con el plugin de C/C++ si el
# servidor lo tiene instalado. Se excluye de la fuente Java/Python para no
# mezclar lenguajes en el mismo índice.
sonar.exclusions=backend/target/**,ia-model/.venv/**,iot-firmware/.pio/**,docs/**

sonar.java.binaries=backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=ia-model/coverage.xml

# Los tests no cuentan como deuda aunque tengan nombres largos.
sonar.cpd.exclusions=backend/src/test/**,ia-model/tests/**
